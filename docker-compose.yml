services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: { context: ., dockerfile: docker/Dockerfile.api }
    ports: ["8000:8000"]
    environment: [ "FRAUD_REDIS_URL=redis://redis:6379/0" ]
    depends_on: [redis]

  consumer:
    build: { context: ., dockerfile: docker/Dockerfile.api }
    command: ["python", "-m", "fraud_spike.streaming.consumer"]
    environment: [ "FRAUD_REDIS_URL=redis://redis:6379/0" ]
    depends_on: [redis, api]

  dashboard:
    build: { context: ., dockerfile: docker/Dockerfile.api }
    command: ["streamlit", "run", "src/fraud_spike/dashboard/app.py", "--server.address=0.0.0.0"]
    ports: ["8501:8501"]
    environment: [ "FRAUD_REDIS_URL=redis://redis:6379/0" ]
    depends_on: [redis]

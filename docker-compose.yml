services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: { context: ., dockerfile: docker/Dockerfile.api }
    ports: ["8000:8000"]
    environment: [ "FRAUD_REDIS_URL=redis://redis:6379/0" ]
    depends_on: [redis]

  consumer:
    build: { context: ., dockerfile: docker/Dockerfile.api }
    command: ["python", "-m", "fraud_spike.streaming.consumer"]
    environment: [ "FRAUD_REDIS_URL=redis://redis:6379/0" ]
    depends_on: [redis, api]

  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile }
    ports: ["5173:5173"]
    depends_on: [api]

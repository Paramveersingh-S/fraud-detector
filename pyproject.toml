[project]
name = "fraud-spike-detector"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2", "numpy>=1.26", "lightgbm>=4.3", "scikit-learn>=1.4",
    "shap>=0.45", "fastapi>=0.111", "uvicorn[standard]>=0.29", "redis>=5.0",
    "pydantic>=2.7", "pydantic-settings>=2.2", "httpx>=0.27",
    "prometheus-client>=0.20", "streamlit>=1.35", "streamlit-autorefresh>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2", "pytest-asyncio>=0.23", "fakeredis>=2.23",
    "ruff>=0.4", "mypy>=1.10", "pre-commit>=3.7", "locust>=2.28",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
ignore_missing_imports = true
